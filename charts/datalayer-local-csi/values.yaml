# The DaemonSet runs on the runtimes nodes: that is where the pods carrying
# local.csi.datalayer.io volumes are scheduled.
namespace: datalayer-runtimes

driver:
  image: datalayer/local-csi:0.1.0
  imagePullPolicy: Always
  imagePullSecrets:
    - name: reg-creds
  # Where the driver is registered and where the bridge filesystems are
  # mounted before being bound into pods: both under kubeletDir, propagated
  # Bidirectional so the mounts reach the host and the pods.
  kubeletDir: /var/lib/kubelet
  # HTTP port of /healthz (liveness) and /mounts (clouder local-csi status).
  healthPort: 9808
  logLevel: INFO
  # Accept ws:// relay URLs. Development only.
  allowInsecureRelay: false
  nodeSelector:
    role.datalayer.io/runtime: "true"
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

registrar:
  image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The Contents bridge relay, the only destination the driver ever dials.
relay:
  # Host name of the relay (the Contents public host, e.g. r1.datalayer.run).
  # The driver refuses a relay-url whose host differs. Leave empty to accept
  # any wss:// host, which only the NetworkPolicy then restricts.
  host: ""
  port: 443
  # Network-level restriction of the egress: NetworkPolicy has no host name
  # selector, so name the relay by CIDR (an ingress load balancer's address)
  # or, when the relay runs in this cluster, by namespace and pod labels.
  # With neither set, the policy allows the port to any destination.
  cidr: ""
  namespace: ""
  podSelector: {}

networkPolicy:
  enabled: true
  # kube-dns, needed to resolve relay.host.
  dnsNamespace: kube-system
