{{- if .Values.networkPolicy.enabled }}
# The driver dials the relay and nothing else. A NetworkPolicy selects
# destinations by address, not by name, so the relay is named by CIDR or by
# namespace and pod labels; relay.host is enforced by the driver itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "localcsi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "localcsi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: {{ .Values.relay.port }}
      {{- if .Values.relay.cidr }}
      to:
        - ipBlock:
            cidr: {{ .Values.relay.cidr }}
      {{- else if .Values.relay.namespace }}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.relay.namespace }}
          {{- with .Values.relay.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- end }}
{{- end }}
