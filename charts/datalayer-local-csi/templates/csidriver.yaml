apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "localcsi.driverName" . }}
  labels:
    {{- include "localcsi.labels" . | nindent 4 }}
spec:
  # Nothing to provision or attach: the pod names the bridge, the node
  # driver mounts it.
  attachRequired: false
  # kubelet then passes csi.storage.k8s.io/ephemeral and the pod identity in
  # the volume context; the driver refuses a volume without them.
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
  # A FUSE filesystem over the user's folder: kubelet must not chown it.
  fsGroupPolicy: None
  requiresRepublish: false
