aiinference:
  image: datalayer/ai-inference:0.0.1
  sidecar:
    image: datalayer/whoami:0.0.6
  imagePullPolicy: Always
  port: 4450
  registryCredentialsSecret: reg-creds
#  resources:
#    limits:
#      memory: "8192Mi"
#      cpu: "3000m"
  env:
    DATALAYER_INFERENCE_PROVIDER: "bedrock"
    # How long a visitor with no account may use the service, in seconds.
    #
    # Short on purpose: it is enough to ask a question and read the answer on a
    # public page, and not enough for a token copied out of a browser to be
    # worth anything. Raising it raises exactly that exposure.
    DATALAYER_ANONYMOUS_TOKEN_TTL_SECONDS: "60"
    DATALAYER_INFERENCE_MODEL: ""
    DATALAYER_AUTHZ_ENGINE: ""
    DATALAYER_BEDROCK_AWS_ACCESS_KEY_ID: ""
    DATALAYER_BEDROCK_AWS_SECRET_ACCESS_KEY: ""
    DATALAYER_BEDROCK_AWS_DEFAULT_REGION: ""
    DATALAYER_BEDROCK_MODEL: ""
    DATALAYER_AZURE_OPENAI_API_KEY: ""
    DATALAYER_AZURE_OPENAI_CHAT_COMPLETION_ENDPOINT: ""
    DATALAYER_CDN_URL: ""
    DATALAYER_CORS_ORIGIN: "*"
    DATALAYER_JWT_ALGORITHM: ""
    DATALAYER_JWT_CACHE_VALIDATE: "false"
    DATALAYER_JWT_ISSUER: ""
    DATALAYER_JWT_SECRET: ""
    DATALAYER_OPENAI_API_VERSION: ""
    DATALAYER_OPENFGA_AUTHZ_MODEL_ID: ""
    DATALAYER_OPENFGA_REST_URL: "http://datalayer-openfga.datalayer-openfga.svc.cluster.local:8080"
    DATALAYER_OPENFGA_STORE_ID: ""
    DATALAYER_RUNTIME_ENV: "prod"
    DATALAYER_AI_INFERENCE_URL: ""
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://datalayer-otel-otel-collector-svc.datalayer-otel.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://datalayer-otel-otel-collector-svc.datalayer-otel.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://datalayer-otel-otel-collector-svc.datalayer-otel.svc.cluster.local:4317"
    DATALAYER_OTEL_API_KEY: ""
    OTEL_SDK_DISABLED: "false"
    OTEL_PYTHON_LOG_LEVEL: "info"
