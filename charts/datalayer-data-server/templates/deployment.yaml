apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dataserver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dataserver.replicas }}
  selector:
    matchLabels:
      {{- include "dataserver.selectorLabels" . | nindent 6 }}
  strategy:
    # One identity, one pod: the new one registers after the old one has
    # drained, not beside it.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "dataserver.selectorLabels" . | nindent 8 }}
        datalayer.io/app: data-server
      annotations:
        checksum/connectors: {{ toJson .Values.dataserver.connectors | sha256sum }}
    spec:
      {{- with .Values.dataserver.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SIGTERM drains: running jobs get DATALAYER_DATASERVER_DRAIN_SECONDS.
      terminationGracePeriodSeconds: {{ add (int (index .Values.dataserver.env "DATALAYER_DATASERVER_DRAIN_SECONDS" | default "60")) 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: data-server
          image: {{ .Values.dataserver.image }}
          imagePullPolicy: {{ .Values.dataserver.imagePullPolicy }}
          command: ["datalayer-data-server", "run"]
          # No ports, no probes over HTTP: the Data Server listens on
          # nothing. Its health is its heartbeat, which Contents shows as
          # the registration's state.
          env:
            - name: DATALAYER_CONTENTS_URL
              value: {{ .Values.dataserver.contentsUrl | quote }}
            - name: DATALAYER_DATASERVER_IDENTITY
              value: {{ .Values.dataserver.identity | quote }}
            - name: DATALAYER_CONTENTS_DATASERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataserver.apiKeySecret.name }}
                  key: {{ .Values.dataserver.apiKeySecret.key }}
            - name: DATALAYER_DATASERVER_CERT
              value: /etc/datalayer/dataserver/identity/tls.crt
            - name: DATALAYER_DATASERVER_KEY
              value: /etc/datalayer/dataserver/identity/tls.key
            {{- if .Values.dataserver.identitySecret.hasCA }}
            - name: DATALAYER_DATASERVER_CA
              value: /etc/datalayer/dataserver/identity/ca.crt
            {{- end }}
            - name: DATALAYER_DATASERVER_CONNECTORS
              value: /etc/datalayer/dataserver/connectors.json
            - name: DATALAYER_DATASERVER_SPOOL_DIR
              value: /var/spool/datalayer-dataserver
            {{- range $key, $value := .Values.dataserver.envValueFrom }}
            - name: {{ $key }}
              valueFrom: {{- $value | toYaml | nindent 16 }}
            {{- end }}
            {{- range $key, $value := .Values.dataserver.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: connectors
              mountPath: /etc/datalayer/dataserver/connectors.json
              subPath: connectors.json
              readOnly: true
            - name: identity
              mountPath: /etc/datalayer/dataserver/identity
              readOnly: true
            - name: spool
              mountPath: /var/spool/datalayer-dataserver
            {{- with .Values.dataserver.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.dataserver.resources | nindent 12 }}
      volumes:
        - name: connectors
          configMap:
            name: {{ .Release.Name }}-connectors
        - name: identity
          secret:
            secretName: {{ .Values.dataserver.identitySecret.name }}
            defaultMode: 0400
        - name: spool
          emptyDir:
            sizeLimit: {{ .Values.dataserver.spool.sizeLimit }}
        {{- with .Values.dataserver.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.dataserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
