apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtime-contents.datalayer.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  scope: Namespaced
  group: datalayer.io
  names:
    kind: RuntimeContent
    singular: runtime-content
    plural: runtime-contents
    shortNames:
        - rtc
        - rc
        - rcs
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              x-kubernetes-preserve-unknown-fields: true
              type: object
              properties:
                uid:
                  type: string
                  pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
                  title: Stable identity of the content (ULID)
                  description: |
                    Environments select contents by this uid, never by name:
                    a content can be renamed or re-described without every
                    Environment that uses it silently pointing elsewhere.
                    Assigned once, when the content is defined.
                type:
                  type: string
                  enum:
                    - git
                    - nfs
                    - s3
                  title: Type of content
                description:
                  type: string
                  title: Content long description.
                source:
                  type: string
                  title: Content source
                  description: |
                    For `git`, its the repository URI.
                    For `nfs`, its the...
                    For `s3`, its the bucket name.
                location:
                  type: string
                  title: Location (for s3).
                subPath:
                  type: string
                  title: Subpath
                  description: |
                    The subpath of the remote content to mount on the local.
                permissions:
                  type: string
                  enum:
                    - ro
                    - rw
                  default: ro
                secret:
                  title: K8S Secret name for accessing the content
                  type: string
                revision:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                  title: Pinned commit (for git)
                  description: |
                    The commit sha the runtime checks out. A git content
                    without a revision is refused at launch: a tutorial that
                    changes under a user is not the tutorial they were promised.
                sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  title: Digest of the verified tarball (optional)
                  description: |
                    When set, the checkout is verified: the sha256 of
                    `git archive --format=tar <revision>` must match, and the
                    runtime pod fails to start otherwise.
              required:
                - uid
                - type
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: UID
          type: string
          priority: 0
          jsonPath: .spec.uid
          description: Stable identity of the content.
        - name: Type
          type: string
          priority: 0
          jsonPath: .spec.type
          description: Type of content.
        - name: Revision
          type: string
          priority: 1
          jsonPath: .spec.revision
          description: Pinned commit (git).
        - name: Message
          type: string
          priority: 0
          jsonPath: .status.create_content.message
          description: Message returned after the Content creation.
