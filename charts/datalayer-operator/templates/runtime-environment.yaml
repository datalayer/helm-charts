apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtime-environments.datalayer.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  scope: Namespaced
  group: datalayer.io
  names:
    kind: RuntimeEnvironment
    singular: runtime-environment
    plural: runtime-environments
    shortNames:
        - rte
        - re
        - res
        - renv
        - renvs
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                title:
                  type: string
                  title: Environment short description
                description:
                  type: string
                  title: Environment long description
                dockerImage:
                  type: string
                  title: Environment docker image
                icon:
                  type: string
                  title: Environment icon key
                  description: "Optional icon slug. Example: ai-agent resolves to AiAgentIcon from @datalayer/icons-react."
                env:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                    required:
                      - name
                      - value
                example:
                  type: string
                  format: uri
                  title: Environment example
                  description: URL pointing to an environment example code.
                snippets:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        title: A summary of the snippet goal
                      description:
                        type: string
                      code:
                        type: string
                    required:
                      - title
                      - code
                capabilities:
                  type: array
                  title: What a runtime of this environment can do
                  description: |
                    Declared by the names of `datalayer_common.capabilities`
                    (`agent`, `sandbox`, `mcp`, `home-folder`, `gpu`,
                    `snapshot`, `checkpoint`, `local-bridge-mount`). A launch
                    that requires a capability the environment does not
                    declare is refused before the pod exists; the effective
                    set is written on the runtime record. `contents.<uid>` is
                    derived from `contents`, never declared here.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        pattern: "^(agent|sandbox|mcp|home-folder|gpu|snapshot|checkpoint|local-bridge-mount)$"
                        title: The capability, by its name in the vocabulary
                      enabled:
                        type: boolean
                        default: true
                      params:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        title: Capability parameters (e.g. `flavor` for `gpu`)
                    required:
                      - name
                contents:
                  type: array
                  title: Runtime Contents this environment brings, by uid
                  description: |
                    Each entry selects one RuntimeContent by its `spec.uid`
                    and says where it appears in the runtime. Only the
                    selected contents are mounted or checked out; an entry
                    whose uid matches no RuntimeContent refuses the launch.
                  items:
                    type: object
                    properties:
                      uid:
                        type: string
                        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
                        title: The RuntimeContent `spec.uid`
                      mount:
                        type: string
                        title: Absolute path inside the runtime
                      permissions:
                        type: string
                        enum:
                          - ro
                          - rw
                        title: Access from the runtime; never wider than the content's own
                    required:
                      - uid
                      - mount
                contents_build:
                  type: array
                  title: Immutable files built into the environment artifact
                  description: |
                    Each entry names a `source`, its destination `path` in
                    the runtime image and the `sha256` the fetched file must
                    have. The build fetches and verifies every entry
                    (`sha256sum -c`) and fails on a mismatch; the image lists
                    what it carries at /etc/datalayer/environment-contents.json.
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                        title: Where the file is fetched from
                      path:
                        type: string
                        title: Absolute path inside the runtime
                      sha256:
                        type: string
                        pattern: "^[0-9a-f]{64}$"
                        title: Digest the fetched file must have
                    required:
                      - source
                      - path
                      - sha256
                kernel:
                  type: object
                  properties:
                    givenNameTemplate:
                      type: string
                      title: Template for the user kernel name built on the environment
                language:
                  type: string
                  title: Programming language of the environment
                resourcesRanges:
                  type: object
                  title: Pod recommended resources
                  properties:
                    default:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                            ephemeral-storage:
                              type: string
                            nvidia.com/gpu:
                              type: string
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                            ephemeral-storage:
                              type: string
                            nvidia.com/gpu:
                              type: string
                      required:
                        - limits
                  required:
                    - default
              required:
                - title
                - dockerImage
                - language
                - resourcesRanges
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                create_environment:
                  type: object
                  properties:
                    message:
                      type: string
      additionalPrinterColumns:
        - name: DockerImage
          type: string
          priority: 0
          jsonPath: .spec.dockerImage
          description: Docker image for the runtime pods.
        - name: Message
          type: string
          priority: 0
          jsonPath: .status.create_environment.message
          description: Message returned after the Environment creation.
