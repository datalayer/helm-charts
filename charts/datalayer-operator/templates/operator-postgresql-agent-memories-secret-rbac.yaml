{{- if and .Values.operator.rbac.create .Values.operator.postgresqlAgentMemories.grantRBAC }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datalayer-operator-postgresql-memory-secret-reader
  namespace: {{ .Values.operator.postgresqlAgentMemories.namespace | quote }}
  labels:
    app: {{ template "operator.app-name" . }}
    release: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.operator.postgresqlAgentMemories.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datalayer-operator-postgresql-memory-secret-reader
  namespace: {{ .Values.operator.postgresqlAgentMemories.namespace | quote }}
  labels:
    app: {{ template "operator.app-name" . }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.operator.rbac.serviceAccountName }}
    namespace: {{ default .Values.operator.namespace .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datalayer-operator-postgresql-memory-secret-reader
{{- end }}