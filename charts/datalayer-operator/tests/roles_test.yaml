suite: test secure rbac configuration
templates:
  - templates/operator-serviceaccount.yaml
  - templates/operator-clusterrole.yaml
  - templates/operator-clusterrolebinding.yaml
  - templates/operator-postgresql-memory-secret-rbac.yaml
tests:
  - it: "test ServiceAccount creation"
    template: templates/operator-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: datalayer-operator-sa
      - equal:
          path: kind
          value: ServiceAccount

  - it: "test ClusterRole has restricted permissions"
    template: templates/operator-clusterrole.yaml
    asserts:
      - equal:
          path: metadata.name
          value: datalayer-operator-role
      - equal:
          path: kind
          value: ClusterRole

  - it: "test ClusterRoleBinding uses secure ServiceAccount"
    template: templates/operator-clusterrolebinding.yaml
    release:
      namespace: default
    asserts:
      - equal:
          path: subjects[0].name
          value: datalayer-operator-sa
      - equal:
          path: subjects[0].namespace
          value: default
      - equal:
          path: roleRef.name
          value: datalayer-operator-role
      - notEqual:
          path: roleRef.name
          value: cluster-admin

  - it: "test PostgreSQL memory secret rolebinding is enabled by default"
    template: templates/operator-postgresql-memory-secret-rbac.yaml
    release:
      namespace: datalayer-runtimes
    asserts:
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1