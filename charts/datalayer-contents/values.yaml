namespace: datalayer-api

contents:
  image: datalayer/contents:0.1.0
  imagePullPolicy: Always
  # The shared filesystem PVC, mounted at /mnt/shared-fs exactly as the
  # Operator mounts it. The Home Folder and the Volumes live on it, so the
  # service reads and writes the same bytes the runtimes see rather than a
  # copy of them.
  sharedFsPVC: ""
  # Where the claim is mounted, matching the Operator so a path recorded by
  # one service resolves in the other.
  sharedFsMountPath: "/mnt/shared-fs"
  # Public host for the ingress. Contents belongs on the runtimes plane
  # (`r1`), beside the NFS that backs the Home Folder and Volumes —
  # `up.sh` passes DATALAYER_CONTENTS_URL or DATALAYER_RUNTIMES_URL.
  runHost: ""
  apiPort: 9400
  flightPort: 9401
  bridgePort: 9402
  replicas: 1
  env:
    # In-cluster defaults, correct only where Contents is co-located with IAM
    # and Spacer. It is not on the runtimes plane, so `up.sh` overrides both
    # from DATALAYER_IAM_URL / DATALAYER_SPACER_URL — the platform plane's
    # public endpoints, which are routable from anywhere.
    DATALAYER_IAM_URL: "http://datalayer-iam-svc.datalayer-api.svc.cluster.local:9700"
    DATALAYER_SPACER_URL: "http://datalayer-spacer-svc.datalayer-api.svc.cluster.local:9900"
    DATALAYER_CONTENTS_REQUIRE_SOLR: "true"
    # IAM, not Vault. Contents resolves every request's access context against
    # IAM and reaches credentials through IAM's API, because Contents runs on
    # the runtimes plane while Vault is deployed on the platform one — hvac
    # through `datalayer_vault` cannot see it from here. Required: without IAM
    # the service cannot authorize anything.
    DATALAYER_CONTENTS_REQUIRE_IAM: "true"
    # Two distinct Solr inputs, both required:
    #   - ZK_HOST is how the DAOs connect (pysolr.SolrCloud through
    #     ZooKeeper), exactly as every other Solr-backed service does. Without
    #     it the worker dies at startup building its repositories and the API
    #     fails on its first query.
    #   - URL is the HTTP admin endpoint the readiness probe polls; with
    #     DATALAYER_CONTENTS_REQUIRE_SOLR=true an empty value keeps the API
    #     permanently unready.
    # The two Solr services listen on different ports: the headless one on
    # 8983, the common one on 80. Addressing the common service on 8983
    # connects to nothing and the readiness probe reports Solr unreachable,
    # so the URL carries no port — the same form `solr-init.sh` uses.
    DATALAYER_SOLR_ZK_HOST: "solr-datalayer-solrcloud-zookeeper-headless.datalayer-solr.svc.cluster.local"
    DATALAYER_SOLR_URL: "http://solr-datalayer-solrcloud-common.datalayer-solr.svc.cluster.local"
    DATALAYER_CONTENTS_API_KEY: ""
    DATALAYER_CONTENTS_STORAGE_BACKEND: "s3"
    DATALAYER_CONTENTS_STORAGE_BUCKET: "datalayer-contents"
    DATALAYER_CONTENTS_STORAGE_ENDPOINT_URL: ""
    DATALAYER_CONTENTS_STORAGE_REGION: ""
    DATALAYER_CONTENTS_USER_FOLDER_QUOTA_BYTES: "10737418240"
    DATALAYER_CONTENTS_USER_FOLDER_QUOTA_OBJECTS: "100000"
    DATALAYER_CONTENTS_VERSION_RETENTION_DAYS: "30"
    DATALAYER_CONTENTS_CLEANUP_INTERVAL_SECONDS: "300"
    DATALAYER_CONTENTS_MAXIMUM_UPLOAD_PART_BYTES: "16777216"
    DATALAYER_RUNTIMES_API_KEY: ""
    DATALAYER_OPERATOR_API_KEY: ""
    OTEL_SERVICE_NAME: "datalayer-contents"
  envValueFrom:
    # Signs pagination cursors and ETags. It must be at least 32 bytes and it
    # must be stable: rotating it invalidates every cursor and ETag handed out
    # so far. `up.sh` creates the secret once and leaves it alone.
    DATALAYER_CONTENTS_REST_TOKEN_SECRET:
      secretKeyRef:
        name: datalayer-contents-rest-token
        key: secret
    DATALAYER_SOLR_USERNAME:
      secretKeyRef:
        name: solr-basic-auth
        key: username
    DATALAYER_SOLR_PASSWORD:
      secretKeyRef:
        name: solr-basic-auth
        key: password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  processes:
    worker:
      enabled: true
      replicas: 1
    flight:
      enabled: false
      replicas: 1
    bridge:
      enabled: false
      replicas: 1
