namespace: datalayer-api

contents:
  image: datalayer/contents:0.1.0
  imagePullPolicy: Always
  # The shared filesystem PVC, mounted at /mnt/shared-fs exactly as the
  # Operator mounts it. The Home Folder and the Volumes live on it, so the
  # service reads and writes the same bytes the runtimes see rather than a
  # copy of them.
  sharedFsPVC: ""
  # Where the claim is mounted, matching the Operator so a path recorded by
  # one service resolves in the other.
  sharedFsMountPath: "/mnt/shared-fs"
  # Public host for the ingress. Contents belongs on the runtimes plane
  # (`r1`), beside the NFS that backs the Home Folder and Volumes —
  # `up.sh` passes DATALAYER_CONTENTS_URL or DATALAYER_RUNTIMES_URL.
  runHost: ""
  apiPort: 9400
  # Where the worker answers /health and /ready. It is not a service port:
  # nothing but the kubelet talks to it.
  workerProbePort: 9403
  flightPort: 9401
  # The public host of the Arrow Flight gateway, e.g. `flight.<runHost>`.
  # It routes as TLS passthrough on Traefik's `websecure` entrypoint
  # (`templates/ingressroute-flight.yaml`), so it must be a host of its own:
  # a passthrough TCP router matching the API's SNI would swallow the API's
  # TLS before its HTTP router saw it. Empty renders no route; the Flight
  # Service is still there for in-cluster clients.
  flightHost: ""
  bridgePort: 9402
  replicas: 1
  env:
    # In-cluster defaults, correct only where Contents is co-located with IAM
    # and Spacer. It is not on the runtimes plane, so `up.sh` overrides both
    # from DATALAYER_IAM_URL / DATALAYER_SPACER_URL — the platform plane's
    # public endpoints, which are routable from anywhere.
    DATALAYER_IAM_URL: "http://datalayer-iam-svc.datalayer-api.svc.cluster.local:9700"
    DATALAYER_SPACER_URL: "http://datalayer-spacer-svc.datalayer-api.svc.cluster.local:9900"
    DATALAYER_CONTENTS_REQUIRE_SOLR: "true"
    # IAM, not Vault. Contents resolves every request's access context against
    # IAM and reaches credentials through IAM's API, because Contents runs on
    # the runtimes plane while Vault is deployed on the platform one — hvac
    # through `datalayer_vault` cannot see it from here. Required: without IAM
    # the service cannot authorize anything.
    DATALAYER_CONTENTS_REQUIRE_IAM: "true"
    # Two distinct Solr inputs, both required:
    #   - ZK_HOST is how the DAOs connect (pysolr.SolrCloud through
    #     ZooKeeper), exactly as every other Solr-backed service does. Without
    #     it the worker dies at startup building its repositories and the API
    #     fails on its first query.
    #   - URL is the HTTP admin endpoint the readiness probe polls; with
    #     DATALAYER_CONTENTS_REQUIRE_SOLR=true an empty value keeps the API
    #     permanently unready.
    # The two Solr services listen on different ports: the headless one on
    # 8983, the common one on 80. Addressing the common service on 8983
    # connects to nothing and the readiness probe reports Solr unreachable,
    # so the URL carries no port — the same form `solr-init.sh` uses.
    DATALAYER_SOLR_ZK_HOST: "solr-datalayer-solrcloud-zookeeper-headless.datalayer-solr.svc.cluster.local"
    DATALAYER_SOLR_URL: "http://solr-datalayer-solrcloud-common.datalayer-solr.svc.cluster.local"
    DATALAYER_CONTENTS_API_KEY: ""
    DATALAYER_CONTENTS_STORAGE_BACKEND: "s3"
    DATALAYER_CONTENTS_STORAGE_BUCKET: "datalayer-contents"
    DATALAYER_CONTENTS_STORAGE_ENDPOINT_URL: ""
    DATALAYER_CONTENTS_STORAGE_REGION: ""
    DATALAYER_CONTENTS_HOME_FOLDER_QUOTA_BYTES: "10737418240"
    DATALAYER_CONTENTS_HOME_FOLDER_QUOTA_OBJECTS: "100000"
    DATALAYER_CONTENTS_VERSION_RETENTION_DAYS: "30"
    DATALAYER_CONTENTS_CLEANUP_INTERVAL_SECONDS: "300"
    DATALAYER_CONTENTS_MAXIMUM_UPLOAD_PART_BYTES: "16777216"
    # The worker's reconciliation of the catalog against the store: every
    # six hours, sizes only (`_VERIFY` hashes every object, which reads the
    # whole bucket), every version (`_SAMPLE` looks at that many). `0`
    # turns it off. The last report is `GET /operations/reconcile`.
    DATALAYER_CONTENTS_RECONCILE_INTERVAL_SECONDS: "21600"
    DATALAYER_CONTENTS_RECONCILE_VERIFY: "false"
    DATALAYER_CONTENTS_RECONCILE_SAMPLE: "0"
    # Limits beyond the quota; `0` disables the one it names. Queries one
    # actor may have in flight (429 QUERY_LIMIT past it); the rows, bytes
    # and seconds any query may run under, whatever its Datasource allows;
    # tool calls one MCP session may make per minute (429 MCP_RATE_LIMIT);
    # bridge sessions one person may hold (429 BRIDGE_LIMIT); the largest
    # single transfer (413 TRANSFER_TOO_LARGE).
    DATALAYER_CONTENTS_MAX_CONCURRENT_QUERIES: "8"
    DATALAYER_CONTENTS_QUERY_MAX_ROWS: "1000000"
    DATALAYER_CONTENTS_QUERY_MAX_BYTES: "1073741824"
    DATALAYER_CONTENTS_QUERY_MAX_SECONDS: "600"
    DATALAYER_CONTENTS_MCP_CALLS_PER_MINUTE: "60"
    DATALAYER_CONTENTS_MAX_BRIDGES: "10"
    DATALAYER_CONTENTS_MAX_TRANSFER_BYTES: "0"
    DATALAYER_RUNTIMES_API_KEY: ""
    DATALAYER_OPERATOR_API_KEY: ""
    # The Flight gateway's identity when it asks the API whether a ticket is
    # good (`processes.flight`). The API reads it to recognise the gateway;
    # the gateway reads it to introduce itself.
    DATALAYER_CONTENTS_FLIGHT_API_KEY: ""
    # Where the gateway answers /health and /ready. Like the worker's, it is
    # not a service port.
    DATALAYER_CONTENTS_FLIGHT_PROBE_PORT: "9404"
    # The gateway terminates TLS itself (the route is passthrough). Both are
    # PEM or a path to one; put the pair here through `envValueFrom` with
    # `optional: true` — see the chart README — or leave them empty for
    # plain gRPC inside the cluster.
    DATALAYER_CONTENTS_FLIGHT_TLS_CERT: ""
    DATALAYER_CONTENTS_FLIGHT_TLS_KEY: ""
    OTEL_SERVICE_NAME: "datalayer-contents"
  envValueFrom:
    # Signs pagination cursors and ETags. It must be at least 32 bytes and it
    # must be stable: rotating it invalidates every cursor and ETag handed out
    # so far. `up.sh` creates the secret once and leaves it alone.
    DATALAYER_CONTENTS_REST_TOKEN_SECRET:
      secretKeyRef:
        name: datalayer-contents-rest-token
        key: secret
    DATALAYER_SOLR_USERNAME:
      secretKeyRef:
        name: solr-basic-auth
        key: username
    DATALAYER_SOLR_PASSWORD:
      secretKeyRef:
        name: solr-basic-auth
        key: password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Alert rules, as a PrometheusRule the observer's Prometheus picks up.
  # Off by default: the CRD comes with the observer chart, and a cluster
  # without it refuses the manifest. The names are the ones
  # `datalayer_contents/metrics.py` writes; the thresholds are here.
  alerts:
    enabled: false
    # Labels the Prometheus Operator selects rules by, e.g. `release: observer`.
    labels: {}
    workerStalledFor: 5m
    workerAbsentFor: 15m
    deadLetterGrowingFor: 15m
    deadLetterDepth: 25
    # Readiness failures in 10 minutes before a dependency is called down —
    # a probe every 10-15 s makes one blip a handful of failures.
    readinessFailures: 6
    readinessFailingFor: 5m
    bridgeDisconnects: 20
    reconcileDiscrepanciesFor: 10m
    # Must match DATALAYER_CONTENTS_RECONCILE_INTERVAL_SECONDS above.
    reconcileIntervalSeconds: 21600
    limitRefusals: 50
  processes:
    worker:
      enabled: true
      replicas: 1
    # The Arrow Flight gateway: `datalayer-contents-flight`, DoGet of a
    # ticket Contents minted. Flight SQL is not served yet. Enabling it adds
    # the `-flight-svc` Service and, with `flightHost`, the TCP route.
    flight:
      enabled: false
      replicas: 1
    bridge:
      enabled: false
      replicas: 1
