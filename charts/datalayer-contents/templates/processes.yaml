{{- range $name, $process := .Values.contents.processes }}
{{- if $process.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "contents.labels" $ | nindent 4 }}
    datalayer.io/process: {{ $name }}
spec:
  replicas: {{ $process.replicas }}
  selector:
    matchLabels:
      app: contents-{{ $name }}
      release: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: contents-{{ $name }}
        release: {{ $.Release.Name }}
        datalayer.io/app: contents
        datalayer.io/process: {{ $name }}
    spec:
      serviceAccountName: {{ $.Release.Name }}
      imagePullSecrets:
        - name: reg-creds
      containers:
        - name: {{ $name }}
          image: {{ $.Values.contents.image }}
          imagePullPolicy: {{ $.Values.contents.imagePullPolicy }}
          command: ["datalayer-contents-{{ $name }}"]
          env:
            {{- if $.Values.contents.sharedFsPVC }}
            - name: 'DATALAYER_SHARED_FS_VOLUME_CLAIM_NAME'
              value: {{ $.Values.contents.sharedFsPVC }}
            - name: 'DATALAYER_SHARED_FS_MOUNT_PATH'
              value: {{ $.Values.contents.sharedFsMountPath | quote }}
            {{- end }}
            {{- if $.Values.contents.processes.bridge.enabled }}
            - name: DATALAYER_CONTENTS_BRIDGE_ENABLED
              value: "true"
            - name: DATALAYER_CONTENTS_BRIDGE_URL
              value: wss://{{ include "contents.runHost" $ }}/bridges
            - name: DATALAYER_CONTENTS_BRIDGE_PORT
              value: {{ $.Values.contents.bridgePort | quote }}
            {{- end }}
            {{- range $key, $value := $.Values.contents.envValueFrom }}
            - name: {{ $key }}
              valueFrom: {{- $value | toYaml | nindent 16 }}
            {{- end }}
            {{- range $key, $value := $.Values.contents.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if eq $name "worker" }}
            - name: 'DATALAYER_CONTENTS_WORKER_PROBE_PORT'
              value: {{ $.Values.contents.workerProbePort | quote }}
            {{- end }}
          {{- if eq $name "worker" }}
          # The port is set here as well as probed above: the two must agree,
          # and only the chart knows the number.
          {{- end }}
          {{- if eq $name "worker" }}
          ports:
            - name: probes
              containerPort: {{ $.Values.contents.workerProbePort }}
          # The worker answers the same two questions the API does, on a port
          # of its own. It used to touch a file from a thread beside the loop,
          # which kept saying "alive" while the loop itself was wedged, and
          # said nothing at all about Solr being unreachable.
          readinessProbe:
            httpGet:
              path: /ready
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 15
            # Above DATALAYER_CONTENTS_DEPENDENCY_TIMEOUT_SECONDS, so an
            # unreachable dependency is reported as a 503 naming it rather
            # than as an opaque probe timeout.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- end }}
          {{- if $.Values.contents.sharedFsPVC }}
          volumeMounts:
            - name: "shared-fs-data"
              mountPath: {{ $.Values.contents.sharedFsMountPath | quote }}
          {{- end }}
          resources:
            {{- toYaml $.Values.contents.resources | nindent 12 }}
      {{- if $.Values.contents.sharedFsPVC }}
      volumes:
        - name: "shared-fs-data"
          persistentVolumeClaim:
            claimName: {{ $.Values.contents.sharedFsPVC }}
            readOnly: false
      {{- end }}
{{- end }}
{{- end }}
