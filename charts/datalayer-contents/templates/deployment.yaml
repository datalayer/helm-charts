apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "contents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.contents.replicas }}
  selector:
    matchLabels:
      {{- include "contents.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "contents.selectorLabels" . | nindent 8 }}
        datalayer.io/app: contents
    spec:
      serviceAccountName: {{ .Release.Name }}
      imagePullSecrets:
        - name: reg-creds
      containers:
        - name: api
          image: {{ .Values.contents.image }}
          imagePullPolicy: {{ .Values.contents.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.contents.apiPort }}
          env:
            {{- if .Values.contents.sharedFsPVC }}
            - name: 'DATALAYER_SHARED_FS_VOLUME_CLAIM_NAME'
              value: {{ .Values.contents.sharedFsPVC }}
            - name: 'DATALAYER_SHARED_FS_MOUNT_PATH'
              value: {{ .Values.contents.sharedFsMountPath | quote }}
            {{- end }}
            {{- range $key, $value := .Values.contents.envValueFrom }}
            - name: {{ $key }}
              valueFrom: {{- $value | toYaml | nindent 16 }}
            {{- end }}
            {{- range $key, $value := .Values.contents.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/contents/v1/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            # Above DATALAYER_CONTENTS_DEPENDENCY_TIMEOUT_SECONDS (2s), so an
            # unreachable dependency is reported as a 503 naming it rather
            # than as an opaque probe timeout.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/contents/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          {{- if .Values.contents.sharedFsPVC }}
          volumeMounts:
            - name: "shared-fs-data"
              mountPath: {{ .Values.contents.sharedFsMountPath | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.contents.resources | nindent 12 }}
      {{- if .Values.contents.sharedFsPVC }}
      volumes:
        - name: "shared-fs-data"
          persistentVolumeClaim:
            claimName: {{ .Values.contents.sharedFsPVC }}
            readOnly: false
      {{- end }}
