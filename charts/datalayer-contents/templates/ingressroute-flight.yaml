{{- if and .Values.contents.processes.flight.enabled .Values.contents.flightHost }}
# Arrow Flight is gRPC over HTTP/2, and the ticket a client presents is a
# capability: it crosses the ingress as TLS passthrough, terminated by the
# gateway itself, so nothing between the sandbox and the gateway reads it.
# The `datalayer-traefik` chart ships the `kubernetesCRD` provider and the
# `websecure` entrypoint, which is all a passthrough `IngressRouteTCP` needs;
# an h2c (plain HTTP/2) route would need TLS termination at Traefik and a
# `serversscheme: h2c` annotation, and would put the ticket in the clear
# between the two. The host must not be the API's: a passthrough router
# matching that SNI would take the API's TLS too.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Release.Name }}-flight
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "contents.labels" . | nindent 4 }}
    datalayer.io/process: flight
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.contents.flightHost | replace "https://" "" | replace "grpc+tls://" "" }}`)
      services:
        - name: {{ .Release.Name }}-flight-svc
          port: {{ .Values.contents.flightPort }}
  tls:
    passthrough: true
{{- end }}
