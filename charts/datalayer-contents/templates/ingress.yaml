{{- if .Values.contents.runHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: datalayer-traefik
  tls:
    - hosts:
        - {{ include "contents.runHost" . }}
      secretName: {{ include "contents.runHost" . }}-datalayer-api-cert-secret
  rules:
    - host: {{ include "contents.runHost" . }}
      http:
        paths:
          - path: /api/contents
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-svc
                port:
                  number: {{ .Values.contents.apiPort }}
{{- end }}
