{{- if .Values.runtimes.postgresqlAgentMemories.grantRBAC }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datalayer-runtimes-postgresql-memory-secret-reader
  namespace: {{ .Values.runtimes.postgresqlAgentMemories.namespace | quote }}
  labels:
    k8s-app: datalayer-runtimes
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.runtimes.postgresqlAgentMemories.secretName | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datalayer-runtimes-postgresql-memory-secret-reader
  namespace: {{ .Values.runtimes.postgresqlAgentMemories.namespace | quote }}
  labels:
    k8s-app: datalayer-runtimes
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.runtimes.postgresqlAgentMemories.serviceAccountName }}
    namespace: {{ default .Release.Namespace .Values.runtimes.postgresqlAgentMemories.serviceAccountNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datalayer-runtimes-postgresql-memory-secret-reader
{{- end }}
