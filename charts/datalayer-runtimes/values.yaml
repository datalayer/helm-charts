runtimes:
  image: datalayer/runtimes:1.0.9
  imagePullPolicy: Always
  sidecar:
    image: datalayer/whoami:0.0.6
  clusterType: any
  certificateIssuer: letsencrypt
  ingressClass: datalayer-traefik
  port: 9500
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: role.datalayer.io/api
            operator: In
            values:
            - "true"
  env:
    DATALAYER_SOLR_USERNAME:
      secretKeyRef:
        name: solr-basic-auth
        key: username
    DATALAYER_SOLR_PASSWORD:
      secretKeyRef:
        name: solr-basic-auth
        key: password
    DATALAYER_AUTHZ_ENGINE: ""
    DATALAYER_CDN_URL: ""
    DATALAYER_CORS_ORIGIN: "*"
    DATALAYER_CONTENTS_URL: "http://datalayer-contents-svc.datalayer-api.svc.cluster.local:9400"
    DATALAYER_IAM_URL: "http://datalayer-iam-svc.datalayer-api.svc.cluster.local:9700"
    DATALAYER_JWT_ALGORITHM: ""
    DATALAYER_JWT_CACHE_VALIDATE: "false"
    DATALAYER_JWT_ISSUER: "https://id.datalayer.run"
    DATALAYER_JWT_SECRET: ""
    DATALAYER_KAFKA_PASSWORD: ""
    DATALAYER_KAFKA_URL: "datalayer-kafka-kafka-bootstrap.datalayer-kafka.svc.cluster.local:9092"
    DATALAYER_KAFKA_USERNAME: ""
    DATALAYER_OPENFGA_AUTHZ_MODEL_ID: ""
    DATALAYER_OPENFGA_REST_URL: "http://datalayer-openfga.datalayer-openfga.svc.cluster.local:8080"
    DATALAYER_OPENFGA_STORE_ID: ""
    DATALAYER_OPERATOR_API_KEY: ""
    DATALAYER_OPERATOR_URL: "http://datalayer-operator-svc.datalayer-runtimes.svc.cluster.local:2111"
    DATALAYER_RUNTIMES_API_KEY: ""
    DATALAYER_RUNTIMES_URL: "https://r1.datalayer.run"
    DATALAYER_PUBSUB_ENGINE: "kafka"
    DATALAYER_PULSAR_URL: "pulsar://datalayer-pulsar-broker.datalayer-pulsar.svc.cluster.local:6650"
    DATALAYER_RUNTIME_ENV: "prod"
    DATALAYER_SPACER_URL: "http://datalayer-spacer-svc.datalayer-api.svc.cluster.local:9900"
    DATALAYER_RUNTIMES_URL: ""
    DATALAYER_SOLR_ZK_HOST: "solr-datalayer-solrcloud-zookeeper-headless.datalayer-solr.svc.cluster.local"
    DATALAYER_SOLR_RUNTIME_REGISTRATIONS_COLLECTION: "runtime-registrations"
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "https://prod1.datalayer.run/api/otel/v1/otlp/v1/logs"
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "https://prod1.datalayer.run/api/otel/v1/otlp/v1/metrics"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "https://prod1.datalayer.run/api/otel/v1/otlp/v1/traces"
    OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    DATALAYER_OTEL_API_KEY: ""
    OTEL_SDK_DISABLED: "false"
    OTEL_PYTHON_LOG_LEVEL: "info"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_NAMESPACE: "datalayer-postgresql"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_SECRET: "datalayer-postgresql-agent-memories-app"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_HOST: "datalayer-postgresql-agent-memories-rw.datalayer-postgresql.svc.cluster.local"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_PORT: "5432"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_DATABASE: "mem0"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_COLLECTION: "agent_memories"
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_URI: ""
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_USER: ""
    DATALAYER_POSTGRESQL_AGENT_MEMORIES_PASSWORD: ""
  # Cross-namespace RBAC granting the runtimes service account read access to
  # the CloudNativePG memory application secret so the admin memory endpoints
  # can resolve database credentials at runtime.
  postgresqlAgentMemories:
    grantRBAC: true
    namespace: "datalayer-postgresql"
    secretName: "datalayer-postgresql-agent-memories-app"
    serviceAccountName: "datalayer-runtimes"
    serviceAccountNamespace: "datalayer-api"
  tolerations: {}
