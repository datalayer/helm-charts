{{ if eq .Values.iam.clusterType "any" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-ingress
  annotations:
    cert-manager.io/acme-challenge-type: http01
    cert-manager.io/cluster-issuer: {{ .Values.iam.certificateIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-expires: '172800'
    nginx.ingress.kubernetes.io/session-cookie-max-age: '172800'
    nginx.ingress.kubernetes.io/session-cookie-samesite: None
    nginx.ingress.kubernetes.io/session-cookie-name: iam-affinity
    nginx.ingress.kubernetes.io/enable-modsecurity: 'true'
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: 'true'
    traefik.ingress.kubernetes.io/router.tls: 'true'
  labels:
    app: iam
spec:
  ingressClassName: {{ .Values.iam.ingressClass }}
  tls:
  - hosts:
    - {{ template "iam.runHost" . }}
    secretName: {{ template "iam.runHost" . }}-datalayer-api-cert-secret
  rules:
  - host: {{ template "iam.runHost" . }}
    http:
      paths:
      - path: /api/iam
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-svc
            port:
              number: {{ .Values.iam.port }}
      # The OAuth discovery documents an MCP client reads before it can
      # authenticate. RFC 8414 and RFC 9728 place them at the root of the
      # host, so they cannot live behind the /api/iam prefix.
      - path: /.well-known/oauth-authorization-server
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-svc
            port:
              number: {{ .Values.iam.port }}
      - path: /.well-known/oauth-protected-resource
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-svc
            port:
              number: {{ .Values.iam.port }}
      # OpenID Connect Discovery at the host root, for a client given only
      # the host, and in the RFC 8414 path-inserted form; the form under the
      # issuer is already covered by the /api/iam prefix.
      - path: /.well-known/openid-configuration
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-svc
            port:
              number: {{ .Values.iam.port }}
{{- end }}
