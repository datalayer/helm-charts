{{- /*
The key that signs OpenID Connect ID tokens.

Kept as a Secret of its own rather than as one more `iam.env` value: a
private key is not configuration, and it must never appear in `helm get
values` beside the CORS origin. The deployment reads it back through a
`secretKeyRef`, which is the same mechanism the Solr credentials use.

Rendered only when a key is given. Without one the service runs as a plain
OAuth server and refuses the `openid` scope with a message naming this:
https://datalayer.ai/docs/oidc-provider
*/ -}}
{{- if .Values.iam.oidc.privateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iam.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "iam.app-name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  private-key.pem: |
{{ .Values.iam.oidc.privateKey | indent 4 }}
  key-id: {{ .Values.iam.oidc.keyId | default "" | quote }}
{{- end }}
